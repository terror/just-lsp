name: Web

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.1

    - name: Install dependencies
      working-directory: ./www
      run: bun install --frozen-lockfile

    - name: Format
      working-directory: ./www
      run: bun run format-check

    - name: Lint
      working-directory: ./www
      run: bun run lint

    - name: Test
      working-directory: ./www
      run: bun run test

    - name: Build
      working-directory: ./www
      run: bun run build

  changes:
    runs-on: ubuntu-latest

    outputs:
      www: ${{ steps.www.outputs.changed }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Check for website changes
      id: www
      env:
        BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] \
          || [[ ! "$BASE" =~ [1-9a-f] ]] \
          || ! git diff --quiet "$BASE" HEAD -- www vercel.json; then
          echo changed=true >> "$GITHUB_OUTPUT"
        else
          echo changed=false >> "$GITHUB_OUTPUT"
        fi

  deploy:
    if: >-
      github.repository == 'terror/just-lsp' &&
      needs.changes.outputs.www == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    needs:
    - build
    - changes
    runs-on: ubuntu-latest

    env:
      VERCEL_ENVIRONMENT: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      VERCEL_ORG_ID: team_04PzWPep1jOkiNGZfFZhAJht
      VERCEL_PROJECT_ID: prj_ZyvWtlfg1hAkGDi3Z1xyFRyKRdUf
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.1

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Install Vercel CLI
      run: npm install --global vercel@65.16.0

    - name: Pull Vercel configuration
      run: |
        args=(
          --yes
          --environment="$VERCEL_ENVIRONMENT"
          --token="${VERCEL_TOKEN:?Set the VERCEL_TOKEN repository secret}"
        )

        if [[ "$VERCEL_ENVIRONMENT" == preview ]]; then
          args+=(--git-branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}")
        fi

        vercel pull "${args[@]}"

    - name: Build deployment
      run: vercel build --environment="$VERCEL_ENVIRONMENT" --token="$VERCEL_TOKEN"

    - name: Deploy
      id: deploy
      run: |
        url=$(vercel deploy --prebuilt --environment="$VERCEL_ENVIRONMENT" --token="$VERCEL_TOKEN")
        echo "url=$url" >> "$GITHUB_OUTPUT"
